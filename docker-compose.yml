version: '3.8'

services:
  # Cấu hình cho Database MySQL
  db:
    image: mysql:8.0
    container_name: devops_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: testdb
    ports:
      - "3307:3306" # Tránh xung đột với MySQL cài sẵn trên máy bạn
    volumes:
      - db_data:/var/lib/mysql

  # Cấu hình cho Backend
  backend:
    build: ./backend
    container_name: devops_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - APP_NAME=DevOps_Mini_Project
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=123456
      - DB_NAME=testdb
    depends_on:
      - db

  # Cấu hình cho Frontend
  frontend:
    build: ./frontend
    container_name: devops_frontend
    restart: always
    ports:
      - "8081:8081"
    depends_on:
      - backend

# Khai báo volume để lưu trữ dữ liệu MySQL không bị mất khi tắt container
volumes:
  db_data: